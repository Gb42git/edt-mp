name: assemble-v4
on:
  push:
    paths: ['.tmp-v4-a', '.tmp-v4-b', '.github/workflows/assemble-v4.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemblage gate v4
        run: |
          cat .tmp-v4-a .tmp-v4-b > v4/index.html
          echo "997dafff797c1e329c359fd7bdd730f7ed79aa53b094b2ae6dcf452e0bc2b0e3  v4/index.html" | sha256sum -c -
      - name: Nettoyage fragments + commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v4/index.html
          git rm -q .tmp-v4-a .tmp-v4-b
          git commit -m "EDT : build v4 — multi-collègues (suite 108 : Σ générique, clés/enseignant, import OSE 2 pages, référentiel 3 niveaux, bandeaux + figé-par-OSE)" || exit 0
          git push
