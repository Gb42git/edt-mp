name: assemble-v4
on:
  push:
    paths: ['.tmp-v4-a', '.tmp-v4-b', '.tmp-v4-c', '.tmp-v4-d', '.github/workflows/assemble-v4.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemblage gate v4
        run: |
          cat .tmp-v4-a .tmp-v4-b .tmp-v4-c .tmp-v4-d > v4/index.html
          echo "4e7aebbf2600b7e9404033f4d560a59abe50cdd9d395cf249055b45776669d97  v4/index.html" | sha256sum -c -
      - name: Nettoyage fragments + commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v4/index.html
          git rm -q .tmp-v4-a .tmp-v4-b .tmp-v4-c .tmp-v4-d
          git commit -m "EDT : build v4 — correctif 108b (réouverture Synthèse : état enseignant vide au départ, fermeture unique closePerso108, garde-fous check8 108b)" || exit 0
          git push
