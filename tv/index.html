<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="EDT MP">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>EDT Mesures Physiques — Accès</title>
<style>
  /* SUITE 138c : TOUTES les règles de l'écran d'accès sont SCOPÉES sous #lock — l'ancienne
     gate déverrouillait par document.write (remplacement du document), la feuille de
     l'écran d'accès ne cohabitait jamais avec l'app ; en fichiers clairs ELLE COHABITE,
     et les sélecteurs nus (button 100 %, input, h1, p, label) fuientaient sur l'app
     (bouton Rafr. pleine largeur, onglets gonflés — capture du 25/11 23h43). */
  body{margin:0;background:#0f172a}
  /* SUITE 138b : flexion centrée réservée à l'écrAN D'ACCÈS (body.locked), retirée au boot. */
  body.locked{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;color:#e2e8f0}
  #lock .card{background:#1e293b;padding:2rem;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:360px;width:90%}
  #lock h1{margin:0 0 .25rem;font-size:1.25rem}
  #lock p{margin:.25rem 0 1rem;color:#94a3b8;font-size:.9rem}
  #lock input{width:100%;box-sizing:border-box;padding:.65rem;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:1rem}
  #lock button{margin-top:.75rem;width:100%;padding:.65rem;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
  #lock button:disabled{opacity:.5}
  #lock label.mem{display:flex;align-items:center;gap:.45rem;margin-top:.6rem;font-size:.85rem;color:#94a3b8;cursor:pointer;user-select:none}
  #lock label.mem input{width:auto}
  #lock .err{color:#f87171;font-size:.85rem;margin-top:.5rem;display:none}
</style>
</head>
<body class="locked">
<div id="root" style="display:none"></div>
<div id="lock">
<div class="card">
  <h1>EDT Mesures Physiques</h1>
  <p>IUT Saint-Étienne — contenu protégé. Entrez le mot de passe.</p>
  <input id="pw" type="password" placeholder="Mot de passe" autofocus>
  <label class="mem"><input id="mem" type="checkbox"> Mémoriser le mot de passe sur cet appareil</label>
  <button id="go" onclick="unlock(false)">Déverrouiller</button>
  <div class="err" id="err">Mot de passe incorrect.</div>
</div>
</div>
<script>
// SUITE 138 (137 phase 2) : clé d'accès APPLICATIVE — le chiffrage AES de la gate est
// remplacé par un simple contrôle côté navigateur (les fichiers sont publics en clair ;
// le mot de passe reste un garde d'accès, comparé en SHA-256, jamais stocké dans le dépôt).
// Suite 84 conservée à l'identique : clé PAR SEGMENT v2/v3/v4/tv + migration douce de
// l'ancienne clé unique ; le localStorage n'est écrit qu'après une validation MANUELLE
// réussie, jamais par le chemin automatique ; un échec n'efface jamais la mémorisation.
const SEG=(location.pathname.match(/\/(v[234]|tv)\//)||[])[1]||'x';
const PWKEY='edt-mp-pw-'+SEG;
const EXPECTED='efcc859903e75c54f5a049216000431d280fa45e48630f2e0626049393ace6d1';
try{if(!localStorage.getItem(PWKEY)&&localStorage.getItem('edt-mp-pw'))localStorage.setItem(PWKEY,localStorage.getItem('edt-mp-pw'));}catch(x){}
const APP_TITLE="EDT Saint-Étienne — Mesures Physiques (tv)";
const sha=async s=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(c=>c.toString(16).padStart(2,'0')).join('');};
const loadScript=src=>new Promise((ok,fail)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>fail(new Error(src));document.head.appendChild(s);});
let booted=false;
async function boot(){
  if(booted)return;booted=true;
  document.title=APP_TITLE;
  // SUITE 141f : le portail garde son centrage et son thème (body.locked, 138b/138c)
  // JUSQU'AU CHARGEMENT RÉUSSI de React/ReactDOM/app — avant, la classe était retirée
  // AVANT les awaits : sur réseau lent (bundle ~458 Ko) restait une fenêtre de secondes
  // où le portail s'affichait DÉVERROUILLÉ (carte en haut à gauche, preflight Tailwind
  // par-dessus) ; et si un script échouait, l'état cassé PERSISTAIT. Ici : on ne
  // déverrouille qu'une fois tout prêt ; en cas d'échec le portail reste intact et le
  // bouton « Déverrouiller » revient (catch d'unlock).
  // Tailwind : non bloquant (hors ligne, le SW sert la copie opaque en cache) ;
  // React/ReactDOM/app.js sont requis — chargés DANS l'ordre avant d'afficher.
  loadScript('https://cdn.tailwindcss.com').catch(()=>{});
  await loadScript('vendor/react.min.js');
  await loadScript('vendor/reactdom.min.js');
  await loadScript("app-20261126-2021.js");
  document.body.classList.remove('locked'); // SUITE 138b/141f : libérer la flexion APRÈS le chargement réussi
  document.getElementById('lock').style.display='none';
  document.getElementById('root').style.display='';
}
async function unlock(auto){
  const btn=document.getElementById('go'),err=document.getElementById('err');
  btn.disabled=true;btn.textContent='Vérification…';err.style.display='none';
  try{
    const pw=document.getElementById('pw').value;
    if((await sha(pw))!==EXPECTED)throw 0;
    if(!auto){try{if(document.getElementById('mem').checked)localStorage.setItem(PWKEY,pw);else localStorage.removeItem(PWKEY);}catch(x){}}
    await boot();
  }catch(e){
    if(e!==0){/* échec de chargement des scripts (réseau) : laisser réessayer */}
    err.style.display='block';btn.disabled=false;btn.textContent='Déverrouiller';
  }
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock(false);});
// Mot de passe mémorisé : déverrouillage automatique silencieux au chargement — relu TEL
// QUEL depuis l'ancienne gate (AUCUNE redemande), jamais réécrit par ce chemin. Le
// script n'est PAS un module : le top-level await est interdit → IIFE async.
(async()=>{
try{
  const saved=localStorage.getItem(PWKEY);
  if(saved&&(await sha(saved))===EXPECTED){document.getElementById('pw').value=saved;document.getElementById('mem').checked=true;unlock(true).catch(()=>{});}
}catch(x){}
})();
</script>
</body>
</html>
