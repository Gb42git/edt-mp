const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(){
  const btn=document.getElementById('go'),err=document.getElementById('err');
  btn.disabled=true;btn.textContent='Vérification…';err.style.display='none';
  try{
    const pw=document.getElementById('pw').value;
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(SALT),iterations:ITERS,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const raw=b64d(DATA);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(IV)},key,raw);
    const blob=new Blob([new Uint8Array(pt)],{type:"text/html"});location.replace(URL.createObjectURL(blob));
  }catch(e){err.style.display='block';btn.disabled=false;btn.textContent='Déverrouiller';}
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
